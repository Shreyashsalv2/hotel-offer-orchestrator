name: hotel-orchestrator

services:
  temporal:
    image: temporalio/temporal:1.10.1
    # Single-binary Temporal server (SQLite persisted to a volume) with the Web UI built in.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8080", "--db-filename", "/data/temporal.db"]
    user: root
    ports:
      - "7233:7233"   # gRPC frontend
      - "8080:8080"   # Temporal Web UI
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: hotel-orchestrator:latest
    environment: &app-env
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: hotel-offers
      SUPPLIER_BASE_URL: http://api:3000
      SUPPLIER_TIMEOUT_MS: "3000"
      CACHE_TTL_SECONDS: "600"
      SUPPLIER_A_DOWN: ${SUPPLIER_A_DOWN:-false}
      SUPPLIER_B_DOWN: ${SUPPLIER_B_DOWN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: api
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/supplierA/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    image: hotel-orchestrator:latest
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: worker
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temporal-data:
